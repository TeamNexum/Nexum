[package]
name = "nexum-cloud"
description = "Nexum Cloud API: sync, marketplace, AI (skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexum-cloud"
path = "src/main.rs"

[features]
# Real Claude-backed Mode-as-Code. Off by default so the build needs no TLS
# stack; when on, set ANTHROPIC_API_KEY in the environment.
claude = ["dep:reqwest"]

[dependencies]
nexum-schema.workspace = true
nexum-core.workspace = true
serde = { workspace = true }
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
password-hash = { version = "0.5", features = ["getrandom"] }
async-trait.workspace = true
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
