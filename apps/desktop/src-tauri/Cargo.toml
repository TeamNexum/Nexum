[package]
name = "nexum-desktop"
version = "0.1.0"
description = "Nexum desktop app"
edition = "2021"

# Own workspace on purpose: keeps Tauri's build.rs/features out of the core
# workspace at the repo root.
[workspace]

[lib]
name = "nexum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Voice commands (local Whisper). Off by default: building whisper.cpp needs
# cmake and a C++ toolchain. Run the app with `npm run tauri:voice`.
voice = ["dep:nexum-voice", "dep:reqwest"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

# Nexum core (path deps into the sibling crates/ tree).
nexum-core = { path = "../../../crates/nexum-core" }
nexum-schema = { path = "../../../crates/nexum-schema" }
nexum-adapters = { path = "../../../crates/nexum-adapters", features = ["hue"] }
nexum-store = { path = "../../../crates/nexum-store", features = ["sqlite"] }
nexum-voice = { path = "../../../crates/nexum-voice", features = ["whisper"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
