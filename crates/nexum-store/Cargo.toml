[package]
name = "nexum-store"
description = "Persistence for Nexum modes (offline-first): in-memory + optional SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enable the SQLite-backed store. Off by default so the core build needs no
# C toolchain; the desktop app can turn it on.
sqlite = ["dep:rusqlite", "dep:serde_json"]

[dependencies]
nexum-schema.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json = { workspace = true, optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
