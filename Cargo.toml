# Nexum — Rust workspace (core, adapters, store, cloud).
# The desktop app (apps/desktop/src-tauri) is its OWN workspace and is excluded here
# on purpose, so Tauri's build machinery never leaks into the core build/CI.
[workspace]
resolver = "2"
members = [
    "crates/nexum-schema",
    "crates/nexum-core",
    "crates/nexum-adapters",
    "crates/nexum-store",
    "services/nexum-cloud",
]
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nexum Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# internal crates
nexum-schema = { path = "crates/nexum-schema" }
nexum-core = { path = "crates/nexum-core" }
nexum-adapters = { path = "crates/nexum-adapters" }
nexum-store = { path = "crates/nexum-store" }
