name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (sqlite feature)
        run: cargo test -p nexum-store --features sqlite

  desktop-tauri:
    name: Desktop Tauri backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux OS dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy src-tauri
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Check src-tauri
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  bindings:
    name: TS bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate TypeScript bindings from the Rust source of truth
        run: |
          cargo test -p nexum-schema --features ts
          cargo test -p nexum-core --features ts
      - name: Fail if the committed bindings are stale
        run: |
          git diff --exit-code -- packages/schema-ts/src/generated \
            || { echo "::error::Generated TS bindings are out of date. Run 'npm run gen:types' and commit packages/schema-ts/src/generated/."; exit 1; }

  frontend:
    name: Frontend workspaces (test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (Vitest across workspaces)
        run: npm test
      - name: Build (all workspaces)
        run: npm run build

  e2e:
    name: Desktop E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        working-directory: .
        run: npm ci || npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
